<!-- DERECHA -->
<div class="d-flex align-items-center justify-content-end">

    <input id="txtBuscar" class="form-control buscador-normateca mr-3" type="text" placeholder="Buscar...">

    <div class="d-flex align-items-center text-white box-user">

        <!-- AVATAR -->
        <div class="avatar-user mr-2">
            ${(themeDisplay.user.firstName!"")?substring(0,1)}
            ${(themeDisplay.user.lastName!"")?substring(0,1)}
        </div>

        <!-- INFO USUARIO -->
        <div class="user-info">

            <div class="small">
                ${themeDisplay.user.screenName!""}
            </div>

            <span class="nombre-rol">
                ${themeDisplay.user.fullName!""}
            </span>

        </div>

        <button type="button" class="btn btn-cerrar-sesion">
            <i class="bi bi-box-arrow-right"></i>
        </button>

    </div>

</div>

<style>
    .icono-camapana {
        font-size: 25px !important;
    }


    /* BUSCADOR */
    .buscador-normateca {
        width: 220px;
        height: 34px;
        border: none;
        border-radius: 6px;
    }

    /* AVATAR */
    .avatar-user {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #AEADA5;
        color: #a57f2c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }

    .user-info {
        display: flex;
        flex-direction: column;
    }

    /* BADGE */
    .badge-noti {
        position: absolute;
        top: -6px;
        right: -8px;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        border-radius: 50%;
        line-height: 1;
        background-color: #a57f2c;
        color: #fff;
        font-weight: 100;
    }


    .user-info {
        display: none;
    }

    /* RESPONSIVE */
    @media (max-width: 991px) {
        .btn-menu-mobile {
            display: block;
        }

        .menu-normateca {
            position: absolute;
            left: 0;
            top: 110px;
            width: 100%;
            background: var(--brand-color-1);
            flex-direction: column;
            padding: 15px;
            display: none;
        }

        .menu-normateca.show {
            display: flex;
        }

        .buscador-normateca {
            width: 140px;
        }
    }

    @media (min-width: 991px) {
        .user-info {
            display: block;
        }
    }

    @media (min-width: 768px) {
        .paddin-menu-0 {
            padding: 0 !important;
        }
    }

    .btn-cerrar-sesion {
        background-color: transparent;
        border-color: transparent;
        color: #fff;
        font-size: 20px;
        width: 30px;
        height: 35px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-left: 20px;
    }
</style>

<script>
    /*************************************/
    /* CERRAR SESIÓN */
    /*************************************/

    if (typeof window.eventoCerrarSesionNormateca === "function") {
        document.removeEventListener("click", window.eventoCerrarSesionNormateca);
    }

    window.eventoCerrarSesionNormateca = function (e) {
        const btn = e.target.closest(".btn-cerrar-sesion");

        if (!btn) {
            return;
        }

        e.preventDefault();
        e.stopPropagation();

        /*************************************/
        /* VALIDAR MODAL CIERRE DE SESIÓN */
        /*************************************/
        if (typeof window.abrirModalCierreSesion !== "function") {
            console.error(
                "[CIERRE SESIÓN] No se encuentra disponible abrirModalCierreSesion."
            );
            return;
        }

        /*************************************/
        /* ABRIR MODAL */
        /*************************************/
        window.abrirModalCierreSesion({
            titulo: "Cerrar sesión",

            icono: "bi bi-box-arrow-right",

            confirmButton: "Salir",

            campos: [
                {
                    tipo: "textArea",
                    titulo: "",
                    valueDefault: "¿Está seguro de que desea salir?",
                    required: false,
                    width: 100,
                },
            ],

            /*************************************/
            /* CONFIRMAR CIERRE DE SESIÓN */
            /*************************************/
            onGuardar: async function () {
                try {
                    try {
                        if (typeof window.bitacoraService?.accesosLog === "function") {
                            await window.bitacoraService.accesosLog(
                                "Logout",
                                "Cierre de sesión",
                                200,
                                `El usuario ${window.obtenerUsuario()} cerró sesión en el sistema.`
                            );
                        }
                    } catch (error) {
                        console.error("[Cierre de sesión] No fue posible registrar el cierre en bitácora:", error);
                    }

                    /*************************************/
                    /* LIMPIAR ALMACENAMIENTO */
                    /*************************************/
                    localStorage.clear();
                    sessionStorage.clear();

                    /*************************************/
                    /* REDIRIGIR AL LOGOUT DE LIFERAY */
                    /*************************************/
                    window.location.href = "/c/portal/logout?referer=/web/normateca/login";
                } catch (error) {
                    console.error("[CIERRE SESIÓN] Error al cerrar sesión:", error);
                }
            },
        });
    };

    document.addEventListener("click", window.eventoCerrarSesionNormateca);

    (function () {
        async function crearCampanaAdministrador(intentos = 50) {
            const boxUsuario = document.querySelector(".box-user");
            const avatarUsuario = boxUsuario
                ? boxUsuario.querySelector(".avatar-user")
                : null;

            if (!boxUsuario || !avatarUsuario) return;

            /*
             * Evita duplicar la campana si Liferay vuelve
             * a ejecutar el evento.
             */
            if (document.getElementById("noti-camp")) return;

            for (let i = 0; i < intentos; i++) {
                if (typeof window.usuarioEsAdminNormateca === "function") {
                    const esAdministrador = await window.usuarioEsAdminNormateca();

                    if (!esAdministrador) return;

                    const campana = document.createElement("div");

                    campana.className = "position-relative mr-3 text-white";

                    campana.id = "noti-camp";
                    campana.dataset.openListener = "true";

                    campana.innerHTML = `
                    <i
                        class="bi bi-bell icono-camapana"
                        style="font-size: 25px;"
                    ></i>
                    <span class="badge badge-warning badge-noti">0</span>
                `;

                    boxUsuario.insertBefore(campana, avatarUsuario);

                    return;
                }

                await new Promise(function (resolve) {
                    setTimeout(resolve, 200);
                });
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", crearCampanaAdministrador);
        } else {
            crearCampanaAdministrador();
        }

        if (window.Liferay) {
            Liferay.on("allPortletsReady", crearCampanaAdministrador);

            Liferay.on("endNavigate", crearCampanaAdministrador);
        }
    })();

</script>
